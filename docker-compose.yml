services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      SEED_PASSWORD: ${SEED_PASSWORD:-admin12345}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL}
      PROVIDER_TOKEN_ENDPOINT: ${PROVIDER_TOKEN_ENDPOINT}
      PROVIDER_TOKEN_METHOD: ${PROVIDER_TOKEN_METHOD}
      PROVIDER_TOKEN_CONTENT_TYPE: ${PROVIDER_TOKEN_CONTENT_TYPE}
      PROVIDER_TOKEN_GRANT_TYPE: ${PROVIDER_TOKEN_GRANT_TYPE}
      PROVIDER_TOKEN_LIFETIME_SECONDS: ${PROVIDER_TOKEN_LIFETIME_SECONDS}
      PROVIDER_TOKEN_EXTRA_FIELDS: ${PROVIDER_TOKEN_EXTRA_FIELDS}
      PROVIDER_API_PREFIX: ${PROVIDER_API_PREFIX}
      PROVIDER_BALANCE_ELOAD_ENDPOINT: ${PROVIDER_BALANCE_ELOAD_ENDPOINT}
      PROVIDER_BALANCE_ELOAD_HEADERS: ${PROVIDER_BALANCE_ELOAD_HEADERS}
      PROVIDER_BALANCE_DOMPUL_ENDPOINT: ${PROVIDER_BALANCE_DOMPUL_ENDPOINT}
      PROVIDER_BALANCE_DOMPUL_HEADERS: ${PROVIDER_BALANCE_DOMPUL_HEADERS}
      PROVIDER_HISTORY_ENDPOINT: ${PROVIDER_HISTORY_ENDPOINT}
      PROVIDER_HISTORY_HEADERS: ${PROVIDER_HISTORY_HEADERS}
      PROVIDER_HISTORY_DEFAULT_DAYS: ${PROVIDER_HISTORY_DEFAULT_DAYS}
      PROVIDER_HISTORY_MAX_DAYS: ${PROVIDER_HISTORY_MAX_DAYS}
      PROVIDER_PRODUCT_ENDPOINT: ${PROVIDER_PRODUCT_ENDPOINT}
      PROVIDER_PRODUCT_HEADERS: ${PROVIDER_PRODUCT_HEADERS}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
