name: SSH check (staging)

# Temporary: runs only on a push to staging. Deploy never triggers from here —
# deploy.yml listens on master only.
on:
  push:
    branches: [staging]

concurrency:
  group: ssh-check-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_check
          chmod 600 ~/.ssh/id_check
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_check > /dev/null
          echo "private key parses ok"
          ssh-keygen -lf ~/.ssh/id_check

      - name: Verify SSH authentication
        env:
          HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          [ -n "$HOST" ] || { echo "::error::VPS_HOST is empty or unset"; exit 1; }
          [ -n "$VPS_USER" ] || { echo "::error::VPS_USER is empty or unset"; exit 1; }
          ssh -i ~/.ssh/id_check \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$HOST" 'echo AUTH_OK'

      - name: Read-only facts
        env:
          HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_check \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$HOST" 'whoami; hostname; uptime; docker version'
